<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="shell">

    <div class="nav-l">Analisi</div>
    <nav class="nav" id="nav">
      <a href="#board" data-r="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>PRV Board</span></a>
      <a href="#cot" data-r="cot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Posizionamento COT</span></a>
      <a href="#grafico" data-r="grafico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg><span>Grafico</span></a>

    <div class="side-foot" id="side-foot"></div>

  <div class="main">
    <div class="topbar">
      <div class="goto">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="goto" placeholder="Cerca un mercato: EURUSD, oro, Nasdaq…" autocomplete="off"><kbd>/</kbd>
        <div class="goto-list" id="goto-list"></div>
      </div>
      <div class="top-meta"><span class="chipd"><span class="live"></span><span id="stamp"></span></span></div>
    </div>
    <div id="demo"></div>
    <main id="app"><div class="empty">Caricamento…</div></main>
    <footer class="foot"><span class="copy">© 2026 PRV Journal · Tutti i diritti riservati</span><span>Solo a scopo informativo, non costituisce consulenza finanziaria. <span id="foot-gen"></span></span></footer>

<aside class="drawer" id="drawer"></aside>
